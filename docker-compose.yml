services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/data/dev.db
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - sqlite_data:/data

volumes:
  sqlite_data:
