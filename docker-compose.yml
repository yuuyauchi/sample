services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: work_decision_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh
    environment:
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      OLLAMA_NUM_PARALLEL: "1"
    entrypoint: ["/entrypoint.sh"]
    deploy:
      resources:
        limits:
          memory: 6g
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q '.' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  stt:
    build:
      context: ./stt
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - whisper_models:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/work_decision_agent
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      STT_BASE_URL: http://stt:8000
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      stt:
        condition: service_healthy

  migrate:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: builder
    command: npx prisma db push
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/work_decision_agent
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
  whisper_models:
